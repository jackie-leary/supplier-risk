name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: ./backend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: ./backend

      - name: Run tests
        run: npm test
        working-directory: ./backend
